# 文件职责：在 K3s 中部署 BankPilot API 及其集群内 Service。
# 主要内容：单副本 Deployment、ConfigMap/Secret 注入、健康检查、资源限额与安全上下文。
# 关键边界：v0.1 后台 Run 与 API 同进程，因此保持单副本且不向集群外直接暴露。
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: bankpilot
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: bankpilot
spec:
  # 后台 Run 仍在 API 进程内执行，v0.1 保持单副本，避免伪装成可水平扩展。
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: bankpilot
    spec:
      # 先把含点的公网域名作为绝对名称查询，避免节点搜索域的透明 DNS 返回伪地址。
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: api
          image: bankpilot-api:0.1.0-k8s.1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: bankpilot-config
          env:
            - name: BANKPILOT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bankpilot-secrets
                  key: BANKPILOT_DATABASE_URL
            - name: BANKPILOT_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: bankpilot-secrets
                  key: BANKPILOT_SESSION_SECRET
            - name: MODEL_ID
              valueFrom:
                secretKeyRef:
                  name: bankpilot-secrets
                  key: MODEL_ID
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bankpilot-secrets
                  key: OPENROUTER_API_KEY
          readinessProbe:
            httpGet:
              path: /api/v1/readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
