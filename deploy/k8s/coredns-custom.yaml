# 文件职责：为特殊网络环境提供可选的 OpenRouter 加密 DNS 解析。
# 主要内容：仅将 `openrouter.ai` 查询转发到支持 DNS-over-TLS 的公共解析器。
# 关键边界：此文件不在默认 Kustomization 中；只有当集群 DNS 被污染时才单独应用。
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  # 对通常 DNS 被劫持或污染的环境，使用 DNS-over-TLS 解析模型端点。
  # 该配置不依赖模型服务当前的 IP 地址。
  openrouter.server: |
    openrouter.ai:53 {
      errors
      cache 300
      forward . tls://1.1.1.1 tls://1.0.0.1 {
        tls_servername cloudflare-dns.com
      }
    }
