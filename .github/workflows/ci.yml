# 文件职责：定义 BankPilot 的持续集成门禁与 main 分支自动发布。
# 主要内容：API/Web 独立验证；通过后经私有网络与 SSH 更新远程 Docker Compose 服务。
# 关键边界：Pull Request 只验证；只有 main 推送可部署；地址与访问凭据全部来自 GitHub Environment。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  deploy:
    name: Deploy production origin
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, web]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: bankpilot-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Connect private network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Package release
        run: |
          release_archive="${RUNNER_TEMP}/bankpilot-release.tgz"
          tar \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.venv' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='.mypy_cache' \
            --exclude='.ruff_cache' \
            -czf "$release_archive" .

      - name: Deploy remote origin
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          test "$DEPLOY_PATH" != "/"
          remote_archive="/tmp/bankpilot-release-${GITHUB_SHA}.tgz"
          scp "${RUNNER_TEMP}/bankpilot-release.tgz" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_archive}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' RELEASE_ARCHIVE='${remote_archive}' bash -s" \
            < deploy/remote-deploy.sh

      - name: Verify public endpoint
        if: ${{ vars.PUBLIC_URL != '' }}
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: curl --fail --silent --show-error --retry 6 --retry-all-errors "${PUBLIC_URL%/}/api/v1/readyz"
