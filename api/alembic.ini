# 文件职责：配置 Alembic 迁移目录与日志。
# 主要内容：声明脚本目录、源码搜索路径、日志记录器及输出格式。
# 关键边界：数据库连接由迁移运行环境注入，不在此保存凭据。
[alembic]
script_location = migrations
prepend_sys_path = . src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
