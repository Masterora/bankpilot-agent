<!doctype html>
<!--
文件职责：BankPilot 当前产品形态（2026-09-21）的独立交互页面，供产品需求与界面验收使用。
页面内容：总览、账户与导入、账本、交易关系、只读 Agent、月度报告、周期扣款、
分类预算、消费证据助手、设置与运行记录；提供中英切换、证据详情、确认/排除/撤销、分类修改和快照导出。
数据边界：全部数据为合成数据，保存在当前页面内存；刷新恢复初始状态。
计算约束：金额以整数分计算；仅已确认关系调整收支；退款按到账日冲减流出；
跨期证据不移入本期；币种独立；分类统计明确采用原始口径。
交互边界：不连接 API、模型、银行或数据库，不读取用户文件，不执行资金操作。
静态输入仅演示指定日期任务，不将任意文本映射为已执行的模型计划。
维护约束：快照深拷贝保存，账本变更只提示更新，不修改历史结果。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/svg+xml" href="../web/public/bankpilot-mark.svg?v=2">
<title>BankPilot · 账单核查</title>
<link rel="stylesheet" href="prototype/prototype.css">
</head>
<body>
<button class="mobile-shade" id="shade" aria-label="关闭导航"></button>
<aside>
<div class="brand"><img src="../web/public/bankpilot-mark.svg?v=2" alt="">BankPilot</div>
<div class="nav-label" id="nav-label"></div><nav id="nav"></nav>
<div class="sidebar-foot" id="sidebar-foot"></div>
</aside>
<main>
<div class="topbar"><button class="menu small" id="menu" aria-label="打开导航">☰</button><span class="breadcrumb" id="crumb"></span><span class="tiny muted scope">Asia/Shanghai · CNY</span><button data-action="assistant" id="assistant-trigger">问助手</button><button id="lang">EN</button><button class="avatar" id="profile" aria-label="账户">L</button></div>
<div id="content"></div>
</main>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="panel-head"><h2 id="dialog-title"></h2><button class="ghost small" id="close-dialog" aria-label="关闭">✕</button></div><div class="dialog-body" id="dialog-body"></div><div class="dialog-foot" id="dialog-foot"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="prototype/prototype.js" defer></script>
</body>
</html>
