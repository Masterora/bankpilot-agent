<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">BankPilot 系统架构</title>
  <desc id="desc">React 界面通过 FastAPI 调用领域服务；LangGraph Agent 通过模型网关获得计划，通过受控端口读取账本与关系证据。PostgreSQL 保存业务事实与快照，OpenRouter 不直接访问数据库。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#9bb2c0" stroke-width="1.5"/></marker></defs>
  <rect width="1080" height="560" rx="24" fill="#101c26"/>
  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="40" y="44" fill="#78d9c2" font-size="13" letter-spacing="3">ARCHITECTURE / CONTROLLED BY DESIGN</text>
    <text x="40" y="87" fill="#f1f6f8" font-size="28" font-weight="600">模型负责规划，账务事实由程序掌握。</text>
    <g fill="#192b37" stroke="#324854"><rect x="40" y="130" width="215" height="140" rx="14"/><rect x="315" y="130" width="320" height="140" rx="14"/><rect x="720" y="130" width="320" height="140" rx="14"/><rect x="315" y="345" width="320" height="140" rx="14"/><rect x="720" y="345" width="320" height="140" rx="14"/></g>
    <g fill="#f1f6f8" font-size="22" font-weight="600"><text x="60" y="171">React Web</text><text x="337" y="171">FastAPI · 业务用例</text><text x="742" y="171">LangGraph · Agent</text><text x="337" y="386">确定性账务核心</text><text x="742" y="386">Model Gateway</text></g>
    <g fill="#b2c4cf" font-size="16"><text x="60" y="211">导入 / 核对 / 查询</text><text x="60" y="240">TypeScript · Vite</text><text x="337" y="211">身份校验 · 用户隔离</text><text x="337" y="240">事务编排 · 运行快照</text><text x="742" y="211">结构化计划 · 工具白名单</text><text x="742" y="240">受控账本与核查端口</text><text x="337" y="427">来源适配 · 交易关系 · 金额计算</text><text x="337" y="456">经仓储持久化至 PostgreSQL</text><text x="742" y="427">OpenRouter</text><text x="742" y="456">可替换供应商 · 无数据库权限</text></g>
    <g fill="none" stroke="#9bb2c0" stroke-width="2" marker-end="url(#arrow)"><path d="M255 200h53"/><path d="M635 200h78"/><path d="M475 270v68"/><path d="M880 270v68"/><path d="M760 270v34H575v34"/></g>
    <text x="896" y="310" fill="#b2c4cf" font-size="13">请求规划</text><text x="520" y="326" fill="#b2c4cf" font-size="13">受控读取</text>
    <text x="40" y="527" fill="#b2c4cf" font-size="15">账本与关系共同形成结果证据；快照保留生成时状态，后续查询生成新结果。</text>
  </g>
</svg>
